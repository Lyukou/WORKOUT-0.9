<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="./manifest.json">
<title>三分化训练 Pro</title>
<style>
:root{--bg:#0d0d0f;--card:#1c1c20;--hi:#26262c;--bd:#2c2c30;--tx:#f5f5f7;--sub:#8e8e93;--gr:#30d158;--rd:#ff453a;--bl:#0a84ff;--yl:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom);min-height:100vh}
.page{display:none;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px 120px}
.page.active{display:block}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px;margin:0 0 16px;line-height:1.6}
.tip{background:#1a2a3a;border:1px solid #2a4a6a;color:#8ec5ff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:16px}
.continue,.day-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.continue{background:linear-gradient(135deg,#1e3a2a,#1c1c20);border-color:#2a4a35;display:none;align-items:center;justify-content:space-between;gap:10px}
.continue.show{display:flex}
.continue b{color:var(--gr);font-size:12px;display:block;margin-bottom:3px}
.day-card{cursor:pointer}
.day-card:active{background:var(--hi)}
.day-name{font-size:17px;font-weight:600;margin-bottom:5px}
.day-meta{font-size:13px;color:var(--sub)}
.day-card.optional{opacity:.9;border-style:dashed}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--hi);color:var(--sub);margin-left:6px;vertical-align:middle}
.badge.opt{background:#2a2a1a;color:var(--yl)}
button{font-family:inherit}
.btn{background:var(--gr);color:#000;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn.sec{background:var(--hi);color:var(--tx);border:1px solid var(--bd)}
.link{background:transparent;border:1px solid var(--bd);color:var(--sub);border-radius:12px;padding:13px;width:100%;margin-top:10px;font-size:14px}
.bottom-btns{display:flex;gap:10px;margin-top:10px}
.bottom-btns button{flex:1;background:transparent;border:1px solid var(--bd);color:var(--sub);padding:13px;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit}
.top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:8px 0 14px;z-index:9}
.top-title{font-weight:600;font-size:16px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.icon{background:none;border:none;color:var(--tx);font-size:24px;width:40px;height:40px;cursor:pointer}
.danger{background:none;border:none;color:var(--rd);font-size:15px;padding:8px 10px;cursor:pointer}
.ex-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px;margin-bottom:13px}
.ex-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.ex-name{font-size:17px;font-weight:600;line-height:1.3}
.ex-meta{font-size:12px;color:var(--sub);white-space:nowrap;text-align:right;line-height:1.5}
.target{font-size:12px;color:var(--gr);margin-top:4px;line-height:1.5}
.wrow{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.wlabel{font-size:13px;color:var(--sub);min-width:32px}
.step{background:var(--hi);border:1px solid var(--bd);color:var(--tx);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.win{flex:1;min-width:60px;width:0;background:var(--hi);border:1px solid var(--bd);color:var(--tx);height:40px;border-radius:10px;text-align:center;font-size:16px;font-weight:600;padding:0 8px}
.win:focus{outline:none;border-color:var(--bl)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:13px;color:var(--sub)}
.dots{display:flex;gap:10px;flex-wrap:wrap}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid #3a3a3e;background:transparent;color:var(--sub);font-size:15px;font-weight:600;cursor:pointer;padding:0;position:relative}
.dot.done{background:var(--gr);border-color:var(--gr);color:#000}
.dot.done::after{content:attr(data-sum);position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gr);white-space:nowrap;font-weight:500}
.record-row{background:var(--hi);border:1px solid var(--bl);border-radius:12px;padding:12px;margin-top:12px}
.rr-title{font-size:13px;color:var(--bl);font-weight:600;margin-bottom:10px}
.rr-line{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--sub)}
.rr-line input{width:70px;background:var(--card);border:1px solid var(--bd);color:var(--tx);height:38px;border-radius:8px;text-align:center;font-size:16px;font-weight:600}
.rr-line .step{width:38px;height:38px;font-size:18px}
.rir-btns{display:flex;gap:6px}
.rir-btns button{background:var(--card);border:1px solid var(--bd);color:var(--sub);width:38px;height:38px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;padding:0}
.rir-btns button.on{background:var(--bl);border-color:var(--bl);color:#fff}
.rr-done{width:100%;background:var(--gr);color:#000;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:2px}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#1e1e24;border:1px solid #333;border-radius:18px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.55);z-index:99;transition:.2s}
.timer.hide{opacity:0;transform:translateY(20px);pointer-events:none}
.timer.done{background:#0d2e18;border-color:var(--gr)}
.t-label{font-size:12px;color:var(--sub)}
.t-time{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.timer.done .t-time{font-size:20px;color:var(--gr)}
.t-actions{display:flex;gap:8px}
.t-btn{background:var(--hi);border:1px solid var(--bd);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
.t-btn.pri{background:var(--gr);color:#000;border-color:var(--gr)}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer}
.h-head{display:flex;justify-content:space-between;gap:10px}
.h-date{font-size:14px;font-weight:600}
.h-day{font-size:12px;color:var(--sub);text-align:right}
.h-sum{font-size:13px;color:var(--sub);margin-top:7px}
.h-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);font-size:13px;line-height:1.9;color:var(--sub)}
.hist.open .h-detail{display:block}
.empty{text-align:center;color:var(--sub);padding:60px 20px;line-height:1.8;font-size:14px}
.analysis-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-bottom:11px}
.ac-title{font-size:14px;font-weight:600;margin-bottom:6px}
.ac-text{font-size:13px;color:var(--sub);line-height:1.7}
.ac-text b{color:var(--tx)}
.ac-up{border-left:3px solid var(--gr)}
.ac-down{border-left:3px solid var(--rd)}
.ac-rest{border-left:3px solid var(--bl)}
.ac-warn{border-left:3px solid var(--yl);background:#2a2a1a}
.ac-info{border-left:3px solid var(--sub)}
.ac-title .tag{font-size:11px;padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:500;vertical-align:middle}
.tag.up{background:#0d2e18;color:var(--gr)}
.tag.down{background:#2e0d0d;color:var(--rd)}
.tag.rest{background:#0d1e2e;color:var(--bl)}
.tag.warn{background:#2e2a0d;color:var(--yl)}
.set-row{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.set-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.set-name{font-size:15px;font-weight:600;line-height:1.3}
.set-day{font-size:11px;color:var(--sub);margin-top:3px}
.set-rm{font-size:15px;font-weight:700;color:var(--gr);text-align:right;white-space:nowrap}
.set-src{font-size:11px;color:var(--sub);text-align:right;margin-top:2px}
.set-btns{display:flex;gap:8px}
.set-btns button{flex:1;background:var(--hi);border:1px solid var(--bd);color:var(--tx);padding:9px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
.set-sug{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
</style>
</head>
<body>

<div id="homePage" class="page active">
  <h1>三分化训练 Pro</h1>
  <p class="sub">背 / 胸 / 腿 · 三练保底 · 五练弹性</p>
  <div class="tip">保底完成 Day1–Day3。恢复好可加 <b>Day4 二头弱项</b> 或 <b>Day5 轻量补量</b>；Day5 不碰大肌群和二头，加在哪天都不影响恢复。</div>
  <div id="continueCard" class="continue">
    <div><b>继续上次训练</b><span id="continueName"></span></div>
    <button class="btn" onclick="resumeWorkout()">继续</button>
  </div>
  <div id="dayList"></div>
  <div class="bottom-btns">
    <button onclick="showPage('history')">历史记录</button>
    <button onclick="showPage('analysis')">分析</button>
  </div>
  <button class="link" onclick="showPage('settings')">1RM 设置</button>
</div>

<div id="workoutPage" class="page">
  <div class="top">
    <button class="icon" onclick="showPage('home')">←</button>
    <div class="top-title" id="workoutTitle"></div>
    <button class="danger" onclick="finishWorkout(false)">结束</button>
  </div>
  <div id="exerciseList"></div>
</div>

<div id="historyPage" class="page">
  <div class="top">
    <button class="icon" onclick="showPage('home')">←</button>
    <div class="top-title">历史记录</div>
    <div style="width:40px"></div>
  </div>
  <div id="historyList"></div>
  <button class="link" onclick="exportHistory()">导出历史 JSON</button>
</div>

<div id="analysisPage" class="page">
  <div class="top">
    <button class="icon" onclick="showPage('home')">←</button>
    <div class="top-title">分析建议</div>
    <div style="width:40px"></div>
  </div>
  <div id="analysisList"></div>
</div>

<div id="settingsPage" class="page">
  <div class="top">
    <button class="icon" onclick="showPage('home')">←</button>
    <div class="top-title">1RM 设置</div>
    <div style="width:40px"></div>
  </div>
  <div class="tip">初始 1RM 来自你表格里的数据（优先 2023-06-28，缺失的用 2022 记录估算）。每次正式组完成后 App 用 e1RM 自动覆盖；也可手动修改并锁定。</div>
  <div id="settingsList"></div>
</div>

<div id="timerBar" class="timer hide">
  <div><div class="t-label" id="timerLabel">休息中</div><div class="t-time" id="timerTime">00:00</div></div>
  <div class="t-actions">
    <button class="t-btn" id="btnPause">暂停</button>
    <button class="t-btn pri" id="btnSkip">跳过</button>
  </div>
</div>

<script>
const PLAN={
day1:{title:'Day1',sub:'背 + 肩后束 + 二头',optional:false,ex:[
{id:'d1a',name:'直臂下拉（前置）',sets:2,reps:'12',rest:45,target:'轻 10–15kg',note:'背阔肌激活，不做到力竭',main:false},
{id:'d1e1',name:'高位下拉',sets:3,reps:'8–10',rest:180,target:'肩胛先下沉',note:'背阔肌主项',main:true,rm1:60},
{id:'d1e2',name:'坐姿划船',sets:3,reps:'8–10',rest:180,target:'挺胸不耸肩',note:'背阔肌',main:true,rm1:50},
{id:'d1e3',name:'俯身杠铃划船',sets:3,reps:'8–10',rest:180,target:'腰不适优先坐姿或哑铃单臂',note:'背阔肌',main:true,rm1:50},
{id:'d1e4',name:'俯身哑铃侧平举',sets:3,reps:'12–15',rest:75,target:'轻 2.5–5kg/手',note:'肩后束',main:true,rm1:5},
{id:'d1e5',name:'杠铃弯举',sets:3,reps:'8–10',rest:90,target:'二头弱项，标准优先',note:'',main:true,rm1:12},
{id:'d1e6',name:'哑铃弯举',sets:3,reps:'10–12',rest:75,target:'不甩身',note:'',main:true,rm1:12}
]},
day2:{title:'Day2',sub:'胸 + 肩前中束 + 三头 + 核心',optional:false,ex:[
{id:'d2a',name:'交替摸肩（前置）',sets:2,reps:'20（每侧10）',rest:45,target:'自重',note:'核心抗旋转/肩胛稳定，慢',main:false},
{id:'d2e1',name:'平板杠铃卧推',sets:3,reps:'6–8',rest:150,target:'单人优先史密斯/保护架',note:'胸',main:true,rm1:60},
{id:'d2e2',name:'上斜杠铃卧推',sets:3,reps:'8–10',rest:150,target:'30°左右',note:'胸',main:true,rm1:40},
{id:'d2e3',name:'坐姿器械胸推',sets:3,reps:'10–12',rest:120,target:'器械更安全',note:'胸',main:true,rm1:20},
{id:'d2e4',name:'坐姿哑铃肩推',sets:3,reps:'6–10',rest:120,target:'肩前中束',note:'',main:true,rm1:20},
{id:'d2e5',name:'侧平举',sets:3,reps:'12–15',rest:75,target:'小重量控制下放',note:'肩中束',main:true,rm1:5},
{id:'d2e6',name:'双杠臂屈伸',sets:3,reps:'8–10',rest:105,target:'三头',note:'1RM 数据可能不准，可在设置里校准',main:true,rm1:null},
{id:'d2e7',name:'三头绳索下压',sets:3,reps:'10–12',rest:75,target:'三头',note:'',main:true,rm1:15}
]},
day3:{title:'Day3',sub:'腿 + 腹 + 小腿 + 臀',optional:false,ex:[
{id:'d3a',name:'靠墙静蹲（前置）',sets:2,reps:'30–45s',rest:45,target:'自重',note:'膝不适减小角度',main:false},
{id:'d3b',name:'臀举（前置）',sets:2,reps:'15',rest:45,target:'轻',note:'臀大肌激活',main:false,rm1:40},
{id:'d3e1',name:'腿举',sets:4,reps:'8–10',rest:180,target:'体重大，先用器械主项',note:'股四',main:true,rm1:100},
{id:'d3e2',name:'颈后自由深蹲',sets:4,reps:'8–10',rest:180,target:'用安全架，重量保守',note:'股四',main:true,rm1:40},
{id:'d3e3',name:'罗马尼亚硬拉',sets:4,reps:'8–10',rest:150,target:'腰背中立',note:'腘绳肌',main:true,rm1:60},
{id:'d3e4',name:'悬垂举腿',sets:3,reps:'10–15',rest:75,target:'自重',note:'下腹',main:true,rm1:null},
{id:'d3e5',name:'屈膝仰卧起坐',sets:3,reps:'15–20',rest:60,target:'自重',note:'腹',main:true,rm1:null},
{id:'d3e6',name:'山羊挺身',sets:2,reps:'12–15',rest:60,target:'自重或5kg',note:'下背',main:true,rm1:null},
{id:'d3e7',name:'站姿提踵',sets:3,reps:'12–15',rest:60,target:'小腿',note:'',main:true,rm1:30},
{id:'d3e8',name:'转体卷腹',sets:2,reps:'12–15',rest:60,target:'自重',note:'腹斜肌',main:true,rm1:null}
]},
day4:{title:'Day4',sub:'二头弱项日',optional:true,ex:[
{id:'d4a',name:'交替摸肩（前置）',sets:2,reps:'20（每侧10）',rest:45,target:'自重',note:'核心稳定',main:false},
{id:'d4e1',name:'锤式弯举',sets:3,reps:'10–12',rest:75,target:'不甩身',note:'二头',main:true,rm1:15},
{id:'d4e2',name:'哑铃弯举',sets:3,reps:'10–12',rest:75,target:'不甩身',note:'二头',main:true,rm1:12},
{id:'d4e3',name:'俯身哑铃侧平举',sets:3,reps:'15',rest:60,target:'轻 2.5–5kg/手',note:'肩后束',main:true,rm1:5},
{id:'d4e4',name:'悬垂举腿',sets:3,reps:'12–20',rest:60,target:'自重',note:'下腹',main:true,rm1:null},
{id:'d4e5',name:'站姿提踵',sets:2,reps:'15',rest:60,target:'小腿',note:'',main:true,rm1:30},
{id:'d4e6',name:'低强度有氧',sets:1,reps:'20–30min',rest:0,target:'快走/椭圆/单车',note:'',main:false}
]},
day5:{title:'Day5',sub:'轻量补量 · 肩/小腿/腹 + 有氧',optional:true,ex:[
{id:'d5e1',name:'侧平举',sets:3,reps:'15',rest:60,target:'轻 2.5–5kg',note:'肩中束',main:true,rm1:5},
{id:'d5e2',name:'前平举',sets:3,reps:'15',rest:60,target:'轻 2.5–5kg',note:'肩前束',main:true,rm1:5},
{id:'d5e3',name:'俯身哑铃侧平举',sets:3,reps:'15',rest:60,target:'轻 2.5–5kg/手',note:'肩后束',main:true,rm1:5},
{id:'d5e4',name:'站姿提踵',sets:3,reps:'15',rest:60,target:'小腿',note:'',main:true,rm1:30},
{id:'d5e5',name:'转体卷腹',sets:2,reps:'15',rest:60,target:'自重',note:'腹斜肌',main:true,rm1:null},
{id:'d5e6',name:'低强度有氧',sets:1,reps:'20–30min',rest:0,target:'快走/椭圆/单车',note:'',main:false}
]}};

let S={day:null,weights:{},sets:{},started:null,timer:{run:false,pause:false,remain:0,end:0,id:null,exId:null,setIndex:null,target:0,startedAt:0}};
let activeSet=null;
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
document.addEventListener('click',initAudio);document.addEventListener('touchstart',initAudio,{passive:true});
function beep(){if(!audioCtx)return;const n=audioCtx.currentTime;[0,.22,.44].forEach(o=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.frequency.value=880;osc.type='sine';g.gain.setValueAtTime(.001,n+o);g.gain.exponentialRampToValueAtTime(.4,n+o+.01);g.gain.exponentialRampToValueAtTime(.001,n+o+.18);osc.connect(g).connect(audioCtx.destination);osc.start(n+o);osc.stop(n+o+.2)})}
function fmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function parseReps(r){const m=String(r).match(/(\d+)\s*[–-]\s*(\d+)/);if(m)return[+m[1],+m[2]];const n=String(r).match(/(\d+)/);if(n)return[+n[1],+n[1]];return[0,0]}
function findEx(id){for(const d of Object.values(PLAN)){const e=d.ex.find(x=>x.id===id);if(e)return e}return null}
function loadActive(){try{return JSON.parse(localStorage.getItem('tt_active'))}catch(e){return null}}
function saveActive(){if(!S.day)return;localStorage.setItem('tt_active',JSON.stringify({day:S.day,weights:S.weights,sets:S.sets,started:S.started}))}
let saveT=null;function dsave(){clearTimeout(saveT);saveT=setTimeout(saveActive,300)}
function lastW(id){try{return (JSON.parse(localStorage.getItem('tt_lastWeight'))||{})[id]||''}catch(e){return ''}}

function pctForReps(reps){
  if(reps<=1)return 1;
  if(reps>20)return 0.6;
  return 1/(1+reps/30);
}
function get1RM(exId){
  const ex=findEx(exId);
  const manual=(JSON.parse(localStorage.getItem('tt_1rm_manual')||'{}'))[exId];
  if(manual)return {value:manual,source:'manual'};
  const initial=ex&&ex.rm1?ex.rm1:null;
  let best=initial||0, source=initial?'initial':null;
  const hist=(JSON.parse(localStorage.getItem('tt_e1rm')||'{}'))[exId]||[];
  hist.forEach(h=>{if(h.e>best){best=h.e;source='auto'}});
  if(!best)return null;
  return {value:Math.round(best*10)/10,source};
}
function suggestWeight(exId){
  const ex=findEx(exId);
  if(!ex||!ex.main)return null;
  const r=get1RM(exId);
  if(!r)return null;
  const [lo,hi]=parseReps(ex.reps);
  const targetReps=hi||lo;
  if(!targetReps)return null;
  const w=Math.round(r.value*pctForReps(targetReps)/2.5)*2.5;
  const firstWeek=Math.round(w*0.85/2.5)*2.5;
  const isDumbbell=/哑铃/.test(ex.name);
  return {w,firstWeek,targetReps,unit:isDumbbell?'kg/手':'kg'};
}
function updateE1RM(exId,weight,reps){
  const ex=findEx(exId);
  if(!ex||!ex.main)return;
  const w=parseFloat(weight);
  const r=parseInt(reps);
  if(!w||!r||r<2||r>15)return;
  const e=w*(1+r/30);
  let hist=JSON.parse(localStorage.getItem('tt_e1rm')||'{}');
  if(!hist[exId])hist[exId]=[];
  hist[exId].push({e:Math.round(e*10)/10,date:new Date().toISOString().slice(0,10),w,r});
  hist[exId]=hist[exId].slice(-10);
  localStorage.setItem('tt_e1rm',JSON.stringify(hist));
}

function migrateActive(a){
  if(!a)return null;
  if(a.sets)return a;
  const sets={};
  Object.entries(a.done||{}).forEach(([exId,arr])=>{
    const ex=findEx(exId);if(!ex)return;
    const arrSets=Array.from({length:ex.sets},()=>null);
    arr.forEach(i=>{arrSets[i]={reps:parseReps(ex.reps)[1],rir:2,done:true,restTarget:ex.rest,restActual:ex.rest,skipped:false}});
    sets[exId]=arrSets;
  });
  return {day:a.day,weights:a.weights||{},sets,started:a.started};
}

function onDotClick(exId,index){

}

const bar=document.getElementById('timerBar'),tt=document.getElementById('timerTime'),tl=document.getElementById('timerLabel'),bp=document.getElementById('btnPause'),bs=document.getElementById('btnSkip');
function startTimer(sec,exId,setIndex){stopTimer();const t=S.timer;t.run=true;t.pause=false;t.remain=sec;t.end=Date.now()+sec*1000;t.exId=exId;t.setIndex=setIndex;t.target=sec;t.startedAt=Date.now();bar.classList.remove('hide','done');tl.textContent='休息中';tt.textContent=fmt(sec);bp.textContent='暂停';t.id=setInterval(tick,200)}
function stopTimer(){const t=S.timer;if(t.id)clearInterval(t.id);t.run=false;t.pause=false;t.id=null;bar.classList.add('hide')}
function updateRestRecord(actual,skipped){const t=S.timer;if(t.exId==null||t.setIndex==null)return;const arr=S.sets[t.exId];if(!arr||!arr[t.setIndex])return;arr[t.setIndex].restActual=actual;arr[t.setIndex].skipped=skipped;saveActive()}
function tick(){const t=S.timer;if(!t.run||t.pause)return;const r=Math.max(0,Math.round((t.end-Date.now())/1000));t.remain=r;tt.textContent=fmt(r);if(r<=0){clearInterval(t.id);t.run=false;updateRestRecord(t.target,false);beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);bar.classList.add('done');tl.textContent='休息结束';tt.textContent='下一组';setTimeout(()=>{bar.classList.remove('done');bar.classList.add('hide')},2500)}}
bp.onclick=()=>{const t=S.timer;if(!t.run&&!t.pause)return;if(t.pause){t.pause=false;t.end=Date.now()+t.remain*1000;t.id=setInterval(tick,200);bp.textContent='暂停'}else{t.pause=true;clearInterval(t.id);bp.textContent='继续'}};
bs.onclick=()=>{const t=S.timer;const actual=Math.round((Date.now()-t.startedAt)/1000);updateRestRecord(actual,true);stopTimer();bar.classList.remove('done')};

function getHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('tt_history'))||[]}catch(e){}return h.map(migrateSession)}
function migrateSession(s){
  if(s.exercises)return s;
  const exercises={};
  Object.entries(s.done||{}).forEach(([exId,arr])=>{
    const ex=findEx(exId);if(!ex)return;
    exercises[exId]={main:ex.main,weight:s.weights?.[exId]??null,sets:arr.map(()=>({reps:parseReps(ex.reps)[1],rir:2,done:true,restTarget:ex.rest,restActual:ex.rest,skipped:false}))};
  });

}

function renderHistory(){const box=document.getElementById('historyList');const h=getHistory().sort((a,b)=>b.finished-a.finished);if(!h.length){box.innerHTML='<div class="empty">还没有训练记录<br>完成一次训练后会出现在这里</div>';return}
box.innerHTML=h.map(x=>{const d=PLAN[x.day];if(!d)return '';const done=Object.values(x.exercises||{}).reduce((a,v)=>a+v.sets.length,0);const total=d.ex.reduce((a,e)=>a+e.sets,0);
const det=d.ex.map(e=>{const r=x.exercises[e.id];if(!r||!r.sets.length)return '';const w=r.weight;const reps=r.sets.map(s=>s.reps).join('/');const rir=r.sets.map(s=>s.rir).join('/');return `<div>${e.name}：${r.sets.length}/${e.sets}组 · ${reps}次 · RIR ${rir}${w?' · '+w+'kg':''}</div>`}).filter(Boolean).join('');

function renderAnalysis(){
  const box=document.getElementById('analysisList');
  const h=getHistory();
  if(h.length<2){box.innerHTML='<div class="empty">至少完成 2 次训练后<br>才会给出重量和休息建议</div>';return}
  const tips=[];
  const byEx={};
  h.forEach(s=>{
    Object.entries(s.exercises||{}).forEach(([exId,r])=>{
      if(!r.main||!r.sets||!r.sets.length)return;
      (byEx[exId]||=[]).push({date:s.date,weight:r.weight,sets:r.sets});
    });
  });
  for(const [exId,recs] of Object.entries(byEx)){
    const ex=findEx(exId);if(!ex)continue;
    recs.sort((a,b)=>a.date.localeCompare(b.date));
    const last2=recs.slice(-2);
    if(last2.length<2)continue;
    const [lo,hi]=parseReps(ex.reps);
    if(!hi)continue;
    const lower=/腿|深蹲|硬拉|腿举|提踵/.test(ex.name);
    const inc=lower?5:2.5;
    const allTop=last2.every(r=>r.sets.length&&r.sets.every(s=>s.reps>=hi&&s.rir>=2));
    const sameW=last2[0].weight===last2[1].weight;
    const under=last2.some(r=>r.sets.some(s=>s.reps<lo||s.rir===0));
    if(allTop&&sameW&&last2[0].weight!=null){
      tips.push({type:'up',ex,text:`连续2次同重量 <b>${last2[0].weight}kg</b> 达次数上限且 RIR≥2，建议下次加 <b>${inc}kg</b>（或加1–2次）。`});
    }else if(under){
      tips.push({type:'down',ex,text:`最近2次出现次数低于下限或 RIR=0，建议降重量 <b>5–10%</b> 或减1组，先把动作质量拉回来。`});
    }
    const recent3=recs.slice(-3);
    const skips=recent3.filter(r=>r.sets.some(s=>s.skipped)).length;
    const exts=recent3.filter(r=>r.sets.some(s=>s.restActual&&s.restTarget&&s.restActual>s.restTarget+15)).length;
    if(skips>=2)tips.push({type:'rest',ex,text:`最近多次手动跳过计时，可考虑把默认休息缩短 <b>15–30s</b>（当前 ${fmt(ex.rest)}）。`});
    if(exts>=2)tips.push({type:'rest',ex,text:`最近多次暂停延长休息，可考虑把默认休息加长 <b>15–30s</b>（当前 ${fmt(ex.rest)}）。`});
  }
  const first=localStorage.getItem('tt_firstDate')||h[0].date;
  const weeks=Math.floor((Date.now()-new Date(first).getTime())/(7*24*3600*1000));
  const dismissWeek=parseInt(localStorage.getItem('tt_deloadDismissed')||'0');
  if(weeks>=6&&weeks<=8&&dismissWeek!==weeks){
    tips.unshift({type:'warn',ex:null,text:`你已训练约 <b>${weeks} 周</b>，建议安排 <b>1 周减量</b>：组数减半、重量降10–20%，然后重新爬坡。`,week:weeks});
  }
  const weekAgo=Date.now()-7*24*3600*1000;
  let biSets=0;
  h.forEach(s=>{if(new Date(s.date).getTime()<weekAgo)return;['d1e5','d1e6','d4e1','d4e2'].forEach(id=>{const r=s.exercises[id];if(r)biSets+=r.sets.length})});
  if(biSets>12)tips.push({type:'warn',ex:null,text:`近7天二头总组数 <b>${biSets} 组</b>，超过 12 组上限，建议下周少做一个二头动作或减组。`});
  let planSets=0,doneSets=0;
  h.forEach(s=>{if(new Date(s.date).getTime()<weekAgo)return;const d=PLAN[s.day];if(!d)return;planSets+=d.ex.filter(e=>e.main).reduce((a,e)=>a+e.sets,0);doneSets+=Object.values(s.exercises||{}).filter(r=>r.main).reduce((a,r)=>a+r.sets.length,0)});
  if(planSets>0){
    const rate=Math.round(doneSets/planSets*100);
    tips.push({type:'info',ex:null,text:`近7天正式组完成率 <b>${rate}%</b>（${doneSets}/${planSets}）。低于80%时优先退回三练、保证睡眠，不要硬加Day4/Day5。`});
  }
  if(!tips.length){box.innerHTML='<div class="empty">数据还不够形成明确建议<br>再记录1–2次训练</div>';return}
  const tagName={up:'加重',down:'减重',rest:'休息',warn:'提醒',info:'概览'};
  box.innerHTML=tips.map(t=>{
    const cls='ac-'+t.type;
    return `<div class="analysis-card ${cls}"><div class="ac-title">${t.ex?t.ex.name:tagName[t.type]}<span class="tag ${t.type}">${tagName[t.type]}</span></div><div class="ac-text">${t.text}${t.week?` <button class="btn sec" style="padding:6px 10px;font-size:12px;margin-top:8px" onclick="dismissDeload(${t.week})">知道了</button>`:''}</div></div>`;
  }).join('');
}

function edit1RM(exId){
  const ex=findEx(exId);

function exportHistory(){
  const h=getHistory();
  const data={exportedAt:new Date().toISOString(),history:h,oneRM:Object.fromEntries(Object.keys(PLAN).flatMap(dayId=>PLAN[dayId].ex.filter(e=>e.main).map(e=>[e.id,get1RM(e.id)])))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='workout-history-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
initHome();updateHome();
</script>
